<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1d3f">
<title>مفيش نت</title>
<style>
  :root{color-scheme:light dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#0c1d3f;color:#f7f2e6;text-align:center}
  .box{max-width:340px;display:grid;gap:16px;justify-items:center}
  img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 4px #e8b04a}
  h1{font-size:24px;margin:0;color:#e8b04a}
  p{margin:0;line-height:1.8;opacity:.9}
  button{min-height:50px;padding:10px 26px;border:0;border-radius:14px;background:#e8b04a;color:#1c1503;font-weight:700;font-size:17px;font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="box">
  <img src="icon-192.png" alt="">
  <h1>أنت مش متصل بالنت</h1>
  <p>لما النت يرجع هتقدر تكمّل. أي صفحة كنت فاتحها قبل كده هتفضل متاحة.</p>
  <button type="button" onclick="location.reload()">حاول تاني</button>
</div>
</body>
</html>

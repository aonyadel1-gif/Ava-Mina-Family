<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة أمين الأسرة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1f2a44;--mute:#5d6680;--pri:#1f3a6e;--gold:#c8962e;--line:#e6dfcf;--red:#b3261e;--ok:#1e7a3c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{max-width:1100px;margin:auto;padding:16px}
h1{font-size:22px;margin:0;color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
input,select,button{font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink)}
button{cursor:pointer;font-weight:700}.p{background:var(--pri);color:#fff;border:0}.g{background:var(--gold);border:0;color:#1a1a1a}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.bar input{flex:1;min-width:180px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.st{flex:1;min-width:120px;text-align:center}.st b{display:block;font-size:28px;color:var(--pri)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:820px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:middle}th{color:var(--mute);font-size:13px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.tag{padding:2px 10px;border-radius:99px;font-size:12px;background:#eee}.tag.accepted{background:#d8f1e0;color:var(--ok)}
a{color:var(--pri)}.d{color:var(--red)}#err{color:var(--red);min-height:24px}
#login{max-width:340px;margin:12vh auto}#login input{width:100%;margin-bottom:10px}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card">
<h1>🔐 دخول أمين الأسرة</h1><p class="d" id="err"></p>
<input id="em" type="email" placeholder="الإيميل" autocomplete="username">
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="current-password">
<button class="p" id="go" style="width:100%">دخول</button>
</div>
<div id="app" hidden>
<div class="top"><h1>📊 لوحة أمين أسرة آڤا مينا</h1><button id="out">خروج</button></div>
<div class="stats" id="stats"></div>
<div class="bar">
<input id="q" placeholder="ابحث بالاسم أو الهاتف أو القسم">
<select id="fy"><option value="">كل الفرق</option></select>
<select id="fs"><option value="">كل الحالات</option><option value="new">جديد</option><option value="accepted">تم القبول</option></select>
<button class="g" id="csv">تصدير Excel</button>
</div>
<div class="card tw"><table><thead><tr><th>صورة</th><th>الاسم</th><th>الهاتف</th><th>الفرقة / القسم</th><th>الميلاد</th><th>الانضمام</th><th>مهارات</th><th>خدمة سابقة</th><th>الحالة</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="empty" style="text-align:center;color:var(--mute)"></p>
</div>
</div>
<script>
var SUPABASE_URL=(window.AVA_CONFIG||{}).url||'', SUPABASE_KEY=(window.AVA_CONFIG||{}).key||'';
if(!SUPABASE_URL){document.getElementById('err').textContent='لسه محطتش الرابط والمفتاح في ملف config.js';throw new Error('no config')}
var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY),all=[],urls={};
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
async function boot(){
 var s=(await sb.auth.getSession()).data.session;
 $('login').hidden=!!s;$('app').hidden=!s;if(s)load()}
$('go').onclick=async function(){
 var r=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
 if(r.error){$('err').textContent='الإيميل أو كلمة المرور غلط';return}boot()};
$('out').onclick=async function(){await sb.auth.signOut();boot()};
async function load(){
 var r=await sb.from('members').select('*').order('created_at',{ascending:false}).limit(1000);
 if(r.error){$('empty').textContent='تعذر تحميل البيانات: '+r.error.message;return}
 all=r.data;var paths=all.filter(function(m){return m.photo_path}).map(function(m){return m.photo_path});
 if(paths.length){var s=await sb.storage.from('member-photos').createSignedUrls(paths,3600);(s.data||[]).forEach(function(x){urls[x.path]=x.signedUrl})}
 var ys=[...new Set(all.map(function(m){return m.year}).filter(Boolean))];
 $('fy').innerHTML='<option value="">كل الفرق</option>'+ys.map(function(y){return '<option>'+esc(y)+'</option>'}).join('');
 draw()}
function view(){var q=$('q').value.trim().toLowerCase(),y=$('fy').value,s=$('fs').value;
 return all.filter(function(m){return(!y||m.year===y)&&(!s||m.status===s)&&(!q||[m.full_name,m.phone,m.department].join(' ').toLowerCase().indexOf(q)>-1)})}
function draw(){
 var v=view(),by={};all.forEach(function(m){by[m.year]=(by[m.year]||0)+1});
 $('stats').innerHTML='<div class="card st"><b>'+all.length+'</b>إجمالي الأعضاء</div><div class="card st"><b>'+all.filter(function(m){return m.status==='new'}).length+'</b>طلبات جديدة</div>'+Object.keys(by).map(function(k){return '<div class="card st"><b>'+by[k]+'</b>الفرقة '+esc(k)+'</div>'}).join('');
 $('rows').innerHTML=v.map(function(m){var u=urls[m.photo_path];return '<tr><td>'+(u?'<img class="av" src="'+u+'" alt="">':'<div class="av"></div>')+'</td><td><b>'+esc(m.full_name)+'</b><br><small>'+esc(m.email)+'</small></td><td dir="ltr"><a target="_blank" rel="noopener" href="https://wa.me/'+esc(m.phone.replace(/\D/g,'').replace(/^0/,'20'))+'">'+esc(m.phone)+'</a></td><td>'+esc(m.year)+' / '+esc(m.department)+'</td><td>'+esc(m.birth_date)+'</td><td>'+esc(m.joined_year)+'</td><td>'+esc(m.skills)+'</td><td>'+(m.prev_service?'نعم':'لا')+'</td><td><span class="tag '+m.status+'">'+(m.status==='accepted'?'تم القبول':'جديد')+'</span></td><td style="white-space:nowrap">'+(m.status==='accepted'?'':'<button data-a="ok" data-id="'+m.id+'">قبول</button> ')+'<button class="d" data-a="del" data-id="'+m.id+'">حذف</button></td></tr>'}).join('');
 $('empty').textContent=v.length?'':'مفيش أعضاء مطابقين.'}
$('rows').onclick=async function(e){var b=e.target.closest('button');if(!b)return;var id=b.dataset.id,m=all.find(function(x){return x.id===id});
 if(b.dataset.a==='ok'){var r=await sb.from('members').update({status:'accepted'}).eq('id',id);if(!r.error)m.status='accepted'}
 if(b.dataset.a==='del'){if(!confirm('حذف '+m.full_name+' نهائياً؟'))return;var r2=await sb.from('members').delete().eq('id',id);if(!r2.error){if(m.photo_path)await sb.storage.from('member-photos').remove([m.photo_path]);all=all.filter(function(x){return x.id!==id})}}
 draw()};
['q','fy','fs'].forEach(function(i){$(i).addEventListener('input',draw)});
$('csv').onclick=function(){var cols=[['full_name','الاسم'],['phone','الهاتف'],['email','Email'],['year','الفرقة'],['department','القسم'],['birth_date','تاريخ الميلاد'],['joined_year','سنة الانضمام'],['skills','مهارات'],['prev_service','خدمة سابقة'],['status','الحالة'],['created_at','تاريخ التسجيل']];
 var rows=[cols.map(function(c){return c[1]})].concat(view().map(function(m){return cols.map(function(c){return m[c[0]]})}));
 var t='\uFEFF'+rows.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'}).join(',')}).join('\n');
 var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv;charset=utf-8'}));a.download='members.csv';a.click()};
boot();
</script>
</body>
</html>
